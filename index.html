<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Mabruk GS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav id="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <img src="/icons/logo.svg" alt="" class="sidebar-logo" aria-hidden="true">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">Mabruk GS</span>
        <span class="sidebar-brand-sub">General Shop · Eastleigh</span>
      </div>
    </div>
    <a href="#/sell" data-route="#/sell">🛒 Sell</a>
    <a href="#/stock-in" data-route="#/stock-in">📦 Stock In</a>
    <a href="#/products" data-route="#/products">🗃 Products</a>
    <a href="#/suppliers" data-route="#/suppliers">🏭 Suppliers</a>
    <a href="#/credits" data-route="#/credits">💳 Credits</a>
    <a href="#/history" data-route="#/history">📋 Sales History</a>
    <a href="#/financial" data-route="#/financial">💰 Financial</a>
    <button id="pwa-install-btn" class="sidebar-install-btn hidden" type="button">⬇ Install App</button>
  </nav>
  <div id="credit-banner" class="hidden"></div>
  <main id="app"></main>
  <div id="modal-overlay" class="hidden"></div>
  <div id="toast-container"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isLocal) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      } else {
        navigator.serviceWorker.register('/sw.js');
      }
    }
  </script>
</body>
</html>
